[package]
name = "xavyo-api-ssf"
version = "0.1.0"
edition = "2021"
description = "OpenID Shared Signals Framework (SSF) Transmitter API for xavyo: stream management + configuration metadata"
license = "BSL-1.1"
publish = false
repository = "https://github.com/xavyo/xavyo"

[dependencies]
# Workspace crates
xavyo-core = { path = "../xavyo-core" }
xavyo-db = { path = "../xavyo-db" }
xavyo-ssf = { path = "../xavyo-ssf" }
xavyo-auth = { path = "../xavyo-auth" }

# Web framework
axum = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# OpenAPI documentation
utoipa = { workspace = true }

# Database
sqlx = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# URL parsing for the receiver-endpoint SSRF guard
url = "2"

# Outbound SET delivery (push transmitter)
reqwest = { workspace = true }

# Fire-and-forget emission (spawn delivery tasks) + delivery-time DNS resolution
tokio = { workspace = true, features = ["rt", "macros", "net"] }

# Poll-delivery (RFC 8936) per-stream bearer token: generate + SHA-256 hash.
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
wiremock = "0.6"
