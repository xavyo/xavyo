[package]
name = "xavyo-auth"
version = "0.1.0"
edition = "2021"
description = "JWT authentication and password hashing library for xavyo"
license = "BSL-1.1"
publish = false
repository = "https://github.com/xavyo/xavyo"

[dependencies]
# JWT handling
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Password hashing
argon2 = "0.5"

# HTTP client for JWKS
reqwest = { workspace = true }

# Internal dependencies
xavyo-core = { path = "../xavyo-core" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for jti claims
uuid = { version = "1.6", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

# Logging
tracing = "0.1"

# Random for salt generation
rand = "0.8"

# Base64 encoding for JWKS + DPoP
base64 = "0.22"

# SHA-256 for RFC 7638 JWK thumbprints (DPoP cnf.jkt) and ath hashing
sha2 = "0.10"

# HMAC for stateless DPoP-Nonce issuance/verification (RFC 9449 §8)
hmac = "0.12"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
wiremock = "0.6"
# P-256 keygen for signing real DPoP proofs in tests (no production use).
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

[features]
default = []
