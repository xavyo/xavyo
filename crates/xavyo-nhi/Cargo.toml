[package]
name = "xavyo-nhi"
description = "Core types and traits for Non-Human Identity (NHI) management"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true

# Async
async-trait.workspace = true

# Database (for sqlx derives)
sqlx = { workspace = true, optional = true }

# OpenAPI (for utoipa derives)
utoipa = { workspace = true, optional = true }

[dev-dependencies]
tokio-test.workspace = true

[features]
# `domain` brings in the trait + risk-scoring logic. Foundation consumers
# (notably `xavyo-db`, which only needs the type enums for SQLx encode/decode)
# can opt out with `default-features = false, features = ["sqlx"]` to avoid
# pulling NHI domain logic into the persistence layer.
default = ["domain"]
domain = []
sqlx = ["dep:sqlx"]
openapi = ["dep:utoipa"]
