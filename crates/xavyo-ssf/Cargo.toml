[package]
name = "xavyo-ssf"
version = "0.1.0"
edition = "2021"
description = "Shared Signals Framework (SSF) + CAEP transmitter primitives for xavyo: Security Event Tokens, CAEP events, subject identifiers"
license = "BSL-1.1"
publish = false
repository = "https://github.com/xavyo/xavyo"

[dependencies]
# SET signing (RS256, matching the OAuth signing key) — secevent+jwt
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Time handling (event_timestamp / iat)
chrono = { version = "0.4", features = ["serde"] }

# jti generation
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
# Verify signed SETs round-trip in tests (decode with the public key).
base64 = "0.22"
